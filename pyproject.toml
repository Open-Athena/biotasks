[build-system]
requires = ["uv_build==0.12.21"]
build-backend = "uv_build"

[project]
name = "biotasks"
version = "0.1.0"
description = "An open pipeline for generating and validating computational biology tasks."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["cyclopts==5.1.0"]

[project.scripts]
biotasks = "biotasks.cli:main"

[project.urls]
Repository = "https://github.com/Open-Athena/biotasks"
Issues = "https://github.com/Open-Athena/biotasks/issues"

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "ruff==0.16.9",
    "ty==0.0.84",
    "uv==0.12.21",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["experiments"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra", "--strict-config", "--strict-markers"]
