<script>window.BIOTASKS_DATA=__PAYLOAD__;</script><script>
'use strict';
const D=window.BIOTASKS_DATA,rows=D.rows,$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),nice=s=>s.replaceAll('_',' ');
const layouts={methods:['Methods','How we found, recovered and screened the source documents.'],workbench:['Sources','Browse every candidate and its complete evidence record.'],coverage:['Collection composition','Describe the selected documents by biology and recorded route.'],repository:['Overview','Analysis-document evidence across the complete source inventory.'],inventorySources:['Sources','Search sources and inspect document evidence.'],curated:['Source index','Inspect the awesome-biology resource inventory and discovery paths.']};
const inventorySite=D.site==='inventory';
if(inventorySite){for(const k of Object.keys(layouts))if(!['repository','inventorySources'].includes(k))delete layouts[k];}else {delete layouts.repository;delete layouts.inventorySources;}
function siteLink(file){if(location.hostname==='htmlpreview.github.io'){const source=location.search.slice(1);return 'https://htmlpreview.github.io/?'+source.replace(/[^/]+\.html(?:#.*)?$/,file);}return new URL(file,location.href).href;}
$('siteTitle').textContent=inventorySite?'BioTasks · Inventory explorer':'BioTasks · Discovery methods';
document.title=inventorySite?'BioTasks — Inventory explorer':'BioTasks — Discovery methods';
$('companionSite').href=siteLink(inventorySite?'workbench.html':'inventory.html');
$('companionSite').textContent=inventorySite?'Discovery methods ↗':'Inventory explorer ↗';
$('siteFooter').innerHTML=(inventorySite?'1,014 source identities · Original domain labels from issue #5.':'100 selected documents · 98 static inspections · 2 access-only leads.')+' No analyses executed. <a href="https://github.com/Open-Athena/biotasks/issues/16">Research evidence</a>';
let mode=inventorySite?'repository':'methods',query='',route='',domain='',assessment='',selected=rows[0].id,view='overview';
const names=r=>({'tool_documentation':'Selected-tool tutorial inspection','github':'GitHub','bioconductor':'Bioconductor','kaggle':'Kaggle','awesome-biology':'Awesome-biology','hugging_face':'Hugging Face','quarto':'Quarto','marimo':'marimo'}[r]||nice(r));
const badge=r=>`<span class="badge ${r.assessment}">${esc(nice(r.assessment))}</span>`;
const brand='<span class="brand">BioTasks / Analysis discovery</span>';
const note='<p class="note">Suitability is based on static source review. It does not establish reproducibility, scientific validity or reuse permission.</p>';
function filtered(){return rows.filter(r=>(!query||JSON.stringify(r).toLowerCase().includes(query.toLowerCase()))&&(!route||r.route===route)&&(!domain||r.subdomains.includes(domain))&&(!assessment||r.assessment===assessment));}
function metrics(){return '<div class="metrics">'+[[100,'documents'],[70,'apparently suitable'],[19,'unresolved'],[11,'excluded']].map(([n,l])=>`<div class="metric"><b>${n}</b><small>${l}</small></div>`).join('')+'</div>';}
function controls(){const opts=(vals,value,label)=>`<option value="">${label}</option>`+vals.map(([k,v])=>`<option value="${esc(k)}" ${value===k?'selected':''}>${esc(v)}</option>`).join('');return `<div class="controls"><label>Search documents<input id="query" value="${esc(query)}" placeholder="Biology, tool, dataset…"></label><label>Discovery route<select id="route">${opts(Object.keys(D.summary.routes).map(k=>[k,names(k)]),route,'All routes')}</select></label><label>Biology<select id="domain">${opts(D.domains.map(k=>[k,k]),domain,'All subdomains')}</select></label><label>Assessment<select id="assessment">${opts(['apparently_suitable','unresolved','excluded'].map(k=>[k,nice(k)]),assessment,'All assessments')}</select></label><button id="reset">Reset</button></div>`;}
function formatValue(value,key){if(Array.isArray(value))return value.length?'<ul>'+value.map(v=>'<li>'+formatValue(v,key)+'</li>').join('')+'</ul>':'None recorded';if(value&&typeof value==='object')return '<pre style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(JSON.stringify(value,null,2))+'</pre>';if(key==='evidence')return `<a href="https://github.com/Open-Athena/biotasks/blob/codex/research/16-analysis-discovery/experiments/16-analysis-discovery/${esc(value)}" target="_blank" rel="noopener">${esc(value)} ↗</a>`;if(/^https?:\/\//.test(String(value)))return `<a href="${esc(value)}" target="_blank" rel="noopener">${esc(value)} ↗</a>`;return esc(value);}
function projectProvenance(r){const g=D.tool_provenance.groups.find(g=>g.ids.includes(r.id));return g?`<section><h3>Discovery provenance</h3><p><strong>${esc(g.project)}:</strong> ${esc(g.entry)}</p>${g.query?'<p><code>'+esc(g.query)+'</code></p>':''}<p>${esc(g.documents)}</p><p class="muted">${esc(g.limit)}</p></section>`:'';}
function evidence(r){return `${projectProvenance(r)}<p>${badge(r)} <small>${esc(r.id)} · ${esc(nice(r.review_stage))}</small></p><h2>${esc(r.title)}</h2><p><a href="${esc(r.canonical_url)}" target="_blank" rel="noopener">Open original source ↗</a></p><dl>${[['Assessment',r.assessment_reason],['Biology',r.subdomains.join(', ')],['Workflow',r.workflow],['Inputs',r.input_evidence],['Lineage',r.lineage],['Dependencies',r.dependencies],['Code terms',r.code_terms],['Data terms',r.data_terms],['Study cluster',r.study_cluster],['Source revision',r.source_revision||r.source_version||'Not pinned'],['Source hash',r.source_sha256||'Not captured']].map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl><details><summary>Complete source record — all metadata</summary><dl>${Object.entries(r).map(([k,v])=>`<dt>${esc(nice(k))}</dt><dd>${formatValue(v,k)}</dd>`).join('')}</dl></details>`;}
function table(rs){return `<div class="table-wrap"><table><thead><tr><th>Source</th><th>Biology / workflow</th><th>Route</th><th>Assessment</th></tr></thead><tbody>${rs.map(r=>`<tr><td><small>${esc(r.id)}</small><br><button data-source="${r.id}">${esc(r.title)}</button></td><td>${esc(r.subdomains.join(', '))}<br><small>${esc(r.workflow)}</small></td><td>${esc(names(r.route))}</td><td>${badge(r)}</td></tr>`).join('')}</tbody></table></div>`;}
function cards(rs){return '<div class="cards">'+rs.map(r=>`<article class="card"><small>${esc(names(r.route))} · ${r.id}</small><h3>${esc(r.title)}</h3>${badge(r)}<p>${esc(r.workflow)}</p><div class="tags">${r.subdomains.map(d=>`<span class="badge">${esc(d)}</span>`).join('')}</div><button data-source="${r.id}">Inspect evidence ↗</button></article>`).join('')+'</div>';}
function resultContent(){const rs=filtered();return `<div class="result-bar"><span>${rs.length} documents · ${rs.filter(r=>r.assessment==='apparently_suitable').length} apparently suitable</span><button id="export">Export these sources</button></div>`+(rs.length?(mode==='catalog'?cards(rs):table(rs)):'<p class="empty">No documents match. Adjust the filters or reset them.</p>');}
function directory(){return controls()+'<div id="results">'+resultContent()+'</div>';}
function coverage(){const gs=Object.entries(D.summary.routes);return '<p>This matrix describes the selected collection, not coverage of biology by each platform. A blank or zero cell means no selected example, not absence from that platform. Cells show apparently suitable / statically inspected documents. Click any cell to inspect its sources. Biology labels overlap.</p><div class="table-wrap"><table class="matrix"><thead><tr><th>Biology</th>'+gs.map(([k])=>`<th>${esc(names(k))}</th>`).join('')+'</tr></thead><tbody>'+D.domains.map(d=>`<tr><th>${esc(d)}</th>`+gs.map(([k,v])=>`<td class="${v.coverage[d].apparently_suitable?'positive':''}"><button data-route="${k}" data-domain="${d}">${v.coverage[d].apparently_suitable} / ${v.coverage[d].reviewed}</button></td>`).join('')+'</tr>').join('')+'</tbody></table></div><section class="panel" style="margin-top:24px"><h2>Interpreting collection composition</h2><p>Document counts do not establish independent-study breadth. PBMC3k, AdK, HMS and faahKO recur across sources. The 70 apparently suitable documents have 54 provisional study-cluster labels, not 54 verified independent studies.</p><p>Geneformer and DREAM examples retain unresolved processed inputs or model assets. Two Kaggle leads remain access-only; some analytical workflows have unclear biological relevance. Inspect individual source records for the evidence behind each assessment.</p></section>';}
function routes(){return Object.entries(D.summary.routes).map(([k,v])=>`<div class="row"><div>${esc(names(k))}<div class="route-bar"><span style="width:${100*(v.statuses.apparently_suitable||0)/v.identified}%"></span></div></div><strong>${v.statuses.apparently_suitable||0} / ${v.identified}</strong></div>`).join('');}
function nav(){return '<nav>'+[['overview','Overview'],['sources','Source directory'],['coverage','Coverage']].map(([k,t])=>`<button data-view="${k}" aria-pressed="${view===k}">${t}</button>`).join('')+'</nav>';}
const routeMethods={
'github':['Repository search','Biology-focused web searches → repository files → notebook source. Includes challenge-code repositories.'],
'kaggle':['Biology challenges','Find biological competitions → linked notebooks → source and dataset references. Includes CAFA, OpenVaccine, single-cell perturbations, plant pathology and HMS; generic-search access failures remain recorded.'],
'bioconductor':['Workflows and vignettes','Workflow/package indexes → rendered analyses → upstream R Markdown when source recovery is needed. Release pages and upstream revisions are not assumed identical.'],
'awesome-biology':['Curated tool links','awesome-biology → tool documentation → scikit-bio, Bio.Phylo, Scanpy and EBImage analyses.'],
'challenge_project':['Challenge project links','awesome-biology → DREAM → olfaction project → paper analysis notebooks.'],
'gallery':['Gallery search','Biology-targeted marimo gallery query → CAZyLingua analysis lead.'],
'hugging_face':['Model-repository notebooks only','Two selected Geneformer example notebooks from one model repository. This sample does not cover Hugging Face articles or Spaces; see the additional discovery surfaces below.'],
'marimo':['Example pipeline','marimo example catalog → PBMC3k Scanpy pipeline; mirrors are aliases and study reuse is flagged.'],
'quarto':['Analysis catalogs','Primary repository/documentation catalogs → Quarto GWAS, microbiome and RNA-seq analyses.'],
'teaching':['Teaching resources','Targeted Quarto ecology search → reporting lesson → upstream input checks.'],
'tool_documentation':['Select a project, then inspect its tutorials','PlantCV and MDAnalysis were named in targeted searches; Scirpy was opened directly; OpenScope surfaced in an Allen/Neuromatch search. These four catalogs supplied all 28 documents in this group.']};
function methodsPage(){return `<div class="shell"><div class="topline">${brand}<button id="downloadAll">Download complete manifest</button></div><h1>How we discover useful analyses</h1><p class="muted">Compare discovery approaches through the 100 selected documents, their screening results and recorded search paths. This purposive sample supports qualitative comparison, not a ranking of platform yield.</p><section class="panel" id="candidateDefinition"><h2>What is a candidate?</h2><p><strong>One specific analysis document selected for screening and recorded in this collection.</strong> It may be a notebook, a vignette, an R Markdown/Quarto analysis or a worked tutorial. Rendered worked analyses count too: for example, <a href="https://bioconductor.org/packages/devel/bioc/vignettes/DESeq2/inst/doc/DESeq2.html" target="_blank" rel="noopener">the DESeq2 HTML vignette</a>. Candidate L39 records a release-page URL and a pinned R Markdown source inspection; the live devel page is not assumed to be the same version. A repository, search result page or curated list is usually a discovery lead, not itself a candidate. A candidate is not necessarily suitable or runnable: excluded, unresolved and access-only documents remain in the collection.</p><p>For example, two different notebooks from the same repository can be two candidates. Confirmed mirrors of one document count once, with aliases. Different documents using the same dataset remain separate documents, with study reuse flagged.</p><p><strong>“GitHub: 12” means 12 selected documents assigned to that discovery route in this collection—not only 12 notebooks available on GitHub.</strong> Other routes can also lead to GitHub-hosted files. We have not measured the total pool, exhausted repository search or estimated recall. All route counts below describe our selected sample.</p></section><section class="panel" id="toolProvenance"><h2>How did we find the tools?</h2><p><strong>Project discovery → selected project → analysis-document retrieval.</strong> “Tool documentation” describes the last step, not the first. The group below is now labeled “Selected-tool tutorial inspection”; most of it started from tool names supplied in searches or opened directly.</p><div class="table-wrap"><table><thead><tr><th>Project</th><th>How we reached it</th><th>Where documents came from</th><th>Selection limits</th></tr></thead><tbody>${D.tool_provenance.groups.map(g=>`<tr><th>${esc(g.project)}<br><small>${g.ids.length} selected documents</small></th><td>${esc(g.entry)}${g.query?'<p><code>'+esc(g.query)+'</code></p>':''}</td><td>${esc(g.documents)}</td><td>${esc(g.limit)}</td></tr>`).join('')}</tbody></table></div><p><strong>24 of 28 looked suitable within four selected project catalogs.</strong> This supports inspecting these catalogs, not a claim that “tool documentation” is the best discovery route. It does not measure how efficiently unfamiliar tools can be found or how broadly the catalogs cover independent studies.</p></section><section class="panel"><h2>Explore the source inventory</h2><p>Search all 1,014 source identities for notebooks, literate analyses, vignettes and tutorial leads. View document evidence by primary domain and format, with retrieval details available for each source. This inventory complements the separately screened 100-document collection.</p><a href="${siteLink('inventory.html')}">Open the inventory explorer →</a></section><h2>Discovery map: routes used in this collection</h2><p class="muted">Cards preserve the collection’s recorded groupings, which mix discovery methods, hosting and document types; they are not equivalent independent search channels. For each source, distinguish how the project was found from where its document was retrieved. For example, a curated list may lead to GitHub code, and a Quarto document may be hosted by a tool project.</p><div class="method-map">${Object.entries(D.summary.routes).map(([k,v])=>`<button class="method-node" data-method-route="${k}"><span class="brand">${esc(names(k))}</span><h3>${esc(routeMethods[k][0])}</h3><p>${esc(routeMethods[k][1])}</p><small>${v.identified} selected for this collection · ${v.reviewed} inspected · ${v.statuses.apparently_suitable||0} apparently suitable</small><span class="node-link">Inspect sources →</span></button>`).join('')}</div><div class="flow-arrow" aria-hidden="true">↓</div><div class="method-flow"><article><span class="brand">01 / Identify</span><h3>Resolve actual documents</h3><p>Follow indexes and repositories to notebooks, vignettes, R Markdown or Quarto documents. Record the canonical URL, hosting, format and discovery path.</p></article><article><span class="brand">02 / Recover</span><h3>Inspect source evidence</h3><p>Recover readable source; retain revision and hash when available. Trace input paths, dependencies and source terms. Access-only leads stay visible.</p></article><article><span class="brand">03 / Reconcile</span><h3>Track mirrors and study reuse</h3><p>Confirmed mirrors are aliases. Shared datasets form study clusters, not automatic document duplicates. Biological labels may overlap.</p></article><article><span class="brand">04 / Screen</span><h3>Assess analytical suitability</h3><p>Look for a biological question, meaningful analytical choices, specific inputs and identifiable dependencies. Missing evidence remains unresolved.</p></article></div><div class="flow-arrow" aria-hidden="true">↓</div>${metrics()}<p class="note">98 substantive static inspections + 2 access-only leads = 100 candidates. Assessments cover all 100; the two access-only leads are unresolved. No analyses have been executed.</p><details class="panel" id="hfSurfaces"><summary>Hugging Face discovery surfaces and search gaps</summary><p>The two HF candidates above are model-repository notebooks. They are not a representative survey of Hugging Face. Platform documentation confirms additional surfaces; their biological content has not yet been systematically screened for this collection.</p><div class="table-wrap"><table><thead><tr><th>Surface</th><th>What it can contain</th><th>Coverage in this collection</th></tr></thead><tbody><tr><td>Repository notebooks</td><td>Notebook files alongside model assets; notebook viewing and external Colab/Kaggle launch links.</td><td>Two Geneformer notebooks selected; both unresolved.</td></tr><tr><td><a href="https://huggingface.co/docs/hub/blog-articles" target="_blank" rel="noopener">Blog articles / tutorials ↗</a></td><td>Standalone long-form write-ups that can reference models, datasets and Spaces. A post may be a worked analysis, or a lead to linked code; being a blog does not make it executable.</td><td>No systematic biology-article search or candidate screening yet. This does not mean no relevant articles exist.</td></tr><tr><td><a href="https://huggingface.co/docs/hub/spaces-overview" target="_blank" rel="noopener">Spaces / interactive pages ↗</a></td><td>Hosted apps or pages built with Gradio, Docker or static HTML. Inspect the source and biological workflow behind the interface; an interactive demo alone does not establish a reproducible analysis.</td><td>No systematic biological Spaces search or candidate screening yet. No apps launched or computations requested.</td></tr></tbody></table></div><p class="note">An article linking a notebook and a Space may represent one analysis or several distinct artifacts. Trace the content and aliases before counting; do not count each URL as an independent analysis. <a href="https://huggingface.co/docs/hub/notebooks" target="_blank" rel="noopener">HF notebook documentation ↗</a></p></details><div class="two-col"><section class="panel"><h2>Selection and coverage</h2><p>This is a purposive collection, not a random sample or an exhaustive crawl. Searches combine biology-focused queries, competition-first discovery, package indexes, curated links and targeted workflow searches.</p><p>Thirteen overlapping biology labels describe coverage; workflow labels describe the analytical activity. Route totals do not measure platform yield because selection effort and source availability differ.</p><p>Systematic paper-to-code searches, citation following, other challenge platforms and multilingual resources remain untested.</p></section><section class="panel"><h2>Evidence boundaries</h2><p>Input lineage distinguishes observed, adapted, predicted and simulated material. Input locations were traced; analyses were not executed. Source recovery does not validate scientific conclusions.</p><p>Code, document, data and model terms are separate. Static suitability does not establish redistribution permission. Per-candidate manual review effort was not fully tracked.</p><p>Assessments are assistant judgments, not independent validation. “Excluded” applies to the document screened, not the underlying tool.</p></section></div><section class="panel"><h2>Reproduce and inspect</h2><p>The normalized manifest exposes every recorded candidate field. Source details include discovery paths, aliases, input datasets, popularity observations, revisions, hashes and links to evidence files wherever recorded.</p><p><a href="https://github.com/Open-Athena/biotasks/tree/codex/research/16-analysis-discovery/experiments/16-analysis-discovery" target="_blank" rel="noopener">Research artifacts and builders ↗</a> · <a href="https://github.com/Open-Athena/biotasks/blob/codex/research/16-analysis-discovery/experiments/16-analysis-discovery/protocol.md" target="_blank" rel="noopener">Detailed protocol ↗</a></p>${note}</section></div>`;}
function curatedPage(){return `<div class="shell">${brand}<h1 style="margin-top:24px">The curated source index</h1><p><a href="https://github.com/raivivek/awesome-biology/blob/deb849cea4c67bbcd2a4a81c4d014888f357831e/README.md">Pinned awesome-biology index ↗</a></p><p>${D.awesome.inventory.length} bullet-link entries; ${new Set(D.awesome.inventory.map(x=>x.url)).size} distinct literal URLs. These are resources, not counts of analysis documents.</p><button id="curatedSources">Inspect all linked candidates →</button><h2 style="margin-top:28px">Resource inventory</h2><div class="table-wrap"><table><thead><tr><th>Section</th><th>Resource</th></tr></thead><tbody>${D.awesome.inventory.map(x=>`<tr><td>${esc(x.section)}</td><td><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></td></tr>`).join('')}</tbody></table></div></div>`;}
const inventoryLabels={located:'Document located',lead:'Tutorial lead',none_detected:'None detected',unknown:'Unresolved search'};
function formatDistribution(){const a=D.source_inventory,counts=a.formats.map(f=>[f,a.rows.filter(r=>r.formats.includes(f)).length]).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])),max=Math.max(...counts.map(x=>x[1]),1);return `<section class="panel" id="formatDistribution"><h2>Document formats across sources</h2><p>Number of source identities with each detected format. A source can contain several formats, so bars overlap and should not be summed. These are source counts, not notebook counts.</p><div class="format-bars">${counts.map(([f,n])=>`<button class="format-bar" data-format-bar="${esc(f)}" aria-label="${esc(f)}: ${n} sources. Filter the inventory."><span class="format-label">${esc(f)}</span><span class="format-track" aria-hidden="true"><span style="width:${100*n/max}%"></span></span><strong>${n}</strong></button>`).join('')}</div><p class="note">Click a bar to inspect its sources. Consolidated vignettes use the preferred representation: recovered R Markdown is counted as R Markdown; HTML remains a rendered-vignette fallback where authoring source is unrecovered. File formats alone do not establish biological relevance or executability.</p></section>`;}
function repositoryAudit(){const a=D.source_inventory,t=a.all;return `<div class="shell"><div class="topline">${brand}<a href="https://github.com/Open-Athena/biotasks/issues/5" target="_blank" rel="noopener">Source inventory provenance ↗</a></div><h1>Analysis documents across the source inventory</h1><p>Explore notebooks, literate analyses, vignettes and worked-tutorial leads across ${t.sources} source identities. Search, filter by biological domain or format, and inspect the evidence for each source.</p><div class="metrics">${[[t.sources,'sources searched'],[t.located,'with a document located'],[t.lead,'tutorial leads only'],[t.none_detected,'none detected'],[t.unknown,'unresolved search']].map(([n,l])=>`<div class="metric"><b>${n}</b><small>${l}</small></div>`).join('')}</div><p class="note">Counts describe sources with evidence, not unique documents or validated biological analyses. Formats and search depth differ across sources; no detection does not establish absence.</p><details class="panel"><summary>Methods and evidence definitions</summary><p>Discovery follows repository trees and text signatures, package indexes and mirrors, distribution archives, and linked project documentation. Supported formats include Jupyter, R Markdown, Quarto, Sweave/knitr, marimo, Pluto, Jupytext, Wolfram, MATLAB Live Script, Livebook, .NET Interactive, and rendered vignettes.</p><p>“Document located” means a supported file/signature or a document link was found. It does not imply the target was read, scientifically screened or executed. “Tutorial lead” requires further content review. Versioned vignette representations are grouped into one document entry. Verified authoring source is preferred for LLM input; rendered output is a secondary reference. Extracted R code is not treated as the complete authoring document. Where source is not recovered, the available representation remains a labeled fallback. Other possible duplicates are not merged without evidence. Source identities can point to related or shared repositories.</p><p>The inventory and primary-domain labels come from the fixed 1,014-source union in issue #5. Domains classify source projects, not notebook content. Repository revisions, request fingerprints, retrieval methods and limitations are retained per source. Searches have different time anchors and detectors; counts describe evidence found in this inventory, not a uniform detection rate or platform-wide coverage.</p><p>Search bounds include repository-tree limits, up to six selected text-prefix probes, and archive limits of 16 MiB compressed / 64 MiB expanded. Arbitrarily named text notebooks, external pages, submodules and inaccessible content can be missed. No analysis was executed. The separately screened 100-document collection is available on the <a href="${siteLink('workbench.html')}">discovery methods site</a>.</p></details>${formatDistribution()}<h2>By biological domain</h2><div class="table-wrap"><table id="repoDomains"><thead><tr><th>Primary domain</th><th>Sources</th><th>Document located</th><th>Tutorial lead</th><th>None detected</th><th>Unresolved</th></tr></thead><tbody>${Object.entries(a.domains).map(([d,v])=>`<tr><th><button data-audit-domain="${esc(d)}">${esc(d)}</button></th><td>${v.sources}</td><td>${v.located}</td><td>${v.lead}</td><td>${v.none_detected}</td><td>${v.unknown}</td></tr>`).join('')}</tbody></table></div><p><button data-layout="inventorySources">Browse all sources →</button></p></div>`;}
function inventorySources(){const a=D.source_inventory;return `<div class="shell"><div class="topline">${brand}</div><h1>Explore source documents</h1><p>Search the complete inventory and inspect the evidence behind each document link.</p><h2 style="margin-top:28px">Explore sources</h2><div class="controls"><label>Search<input id="auditQuery" placeholder="Source name or document path"></label><label>Primary domain<select id="auditDomain"><option value="">All domains</option>${Object.keys(a.domains).map(d=>`<option>${esc(d)}</option>`).join('')}</select></label><label>Format<select id="auditFormat"><option value="">All formats</option>${a.formats.map(f=>`<option>${esc(f)}</option>`).join('')}</select></label><label>Result<select id="auditStatus"><option value="">All results</option>${Object.entries(inventoryLabels).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label></div><div id="auditRows"></div></div>`;}
function renderAuditRows(){const a=D.source_inventory,q=$('auditQuery').value.toLowerCase(),rs=a.rows.filter(r=>(!$('auditDomain').value||r.primary_domain===$('auditDomain').value)&&(!$('auditStatus').value||r.result===$('auditStatus').value)&&(!$('auditFormat').value||r.formats.includes($('auditFormat').value))&&(!q||JSON.stringify([r.name,r.source_id,r.documents]).toLowerCase().includes(q)));$('auditRows').innerHTML=`<p>${rs.length} source identities</p><div class="table-wrap"><table><thead><tr><th>Source / domain</th><th>Result / formats</th><th>Documents and evidence</th></tr></thead><tbody>${rs.map(r=>`<tr><td><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a><br><small>${esc(r.primary_domain)}</small></td><td>${inventoryLabels[r.result]}<br><small>${esc(r.formats.join(', '))}</small></td><td>${r.documents.slice(0,3).map(n=>`<a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.path)}</a> <small>${esc(n.format)}</small>`).join('<br>')}<details><summary>All recorded evidence</summary><p>${esc(r.method)}</p>${r.documents.map(n=>`<p><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.path)}</a> <small>${esc(n.format)}</small><br><small>${esc(n.format)} · ${esc(n.detection||'')}</small><br><small>${esc(n.llm_input)}</small></p>${n.representations.map(v=>`<p><a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.role)}</a> <small>${esc(v.format)}</small></p>`).join('')}`).join('')}<p>Repository path examples may be limited; full observations remain in the research artifacts.</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(JSON.stringify(r.evidence,null,2))}</pre></details></td></tr>`).join('')}</tbody></table></div>`;}

function render(){let content='';$('concept').textContent=layouts[mode][1];$('choices').innerHTML=Object.entries(layouts).map(([k,v])=>`<button data-layout="${k}" aria-pressed="${k===mode}">${v[0]}</button>`).join('');
if(mode==='repository')content=repositoryAudit();if(mode==='inventorySources')content=inventorySources();if(mode==='methods')content=methodsPage();if(mode==='curated')content=curatedPage();
if(mode==='catalog')content=`<div class="shell"><div class="topline">${brand}<small>100 sources / 13 biology labels</small></div><h1>Find an analysis to build on.</h1><p class="muted">Search the collection, compare workflows, and inspect the evidence behind each assessment.</p>${directory()}${note}</div>`;
if(mode==='dashboard')content=`<div class="shell sidebar-layout"><aside class="sidebar">${brand}${nav()}${note}</aside><div><div class="topline"><h1>${view==='overview'?'Discovery dashboard':view==='sources'?'Source directory':'Biological coverage'}</h1></div>${view==='overview'?metrics()+`<div class="two-col"><div class="panel"><h2>Route composition</h2><p class="muted">Suitable / identified. These are descriptive counts, not platform rankings.</p>${routes()}</div><div><div class="panel"><h2>Review status</h2><p>98 documents inspected; 2 access-only leads.</p><p>19 assessments remain unresolved.</p><button data-view="sources">Browse the evidence →</button></div><div class="panel"><h2>Study reuse</h2><p>PBMC3k, AdK, HMS and faahKO recur. Document counts exceed independent-study coverage.</p></div></div></div>`:view==='sources'?directory():coverage()}</div></div>`;
if(mode==='coverage')content=`<div class="shell"><div class="topline">${brand}<button id="matrixBack">Show full matrix</button></div><h1>What is in this collection?</h1>${view==='sources'?`<p class="muted">Sources for the selected matrix cell. Change filters to explore nearby workflows.</p>${directory()}`:coverage()}${note}</div>`;
if(mode==='workbench')content=`<div class="workbench"><div class="shell"><div class="topline">${brand}<small>Source inspector / 100 documents</small></div><h1 style="font-size:26px;letter-spacing:-.5px">Analysis workbench</h1>${controls()}<div class="split"><div class="source-list" id="sourceList"></div><article class="inspector" id="inspector"></article></div>${note}</div></div>`;
$('app').innerHTML=content;bind();if(mode==='workbench')renderSplit();}
function renderSplit(){const rs=filtered();if(!rs.some(r=>r.id===selected))selected=rs[0]?.id;$('sourceList').innerHTML=rs.length?rs.map(r=>`<button data-select="${r.id}" aria-pressed="${r.id===selected}">${esc(r.title)}<small>${r.id} · ${esc(names(r.route))} · ${esc(nice(r.assessment))}</small></button>`).join(''):'<p class="empty">No matching documents.</p>';$('inspector').innerHTML=selected?evidence(rs.find(r=>r.id===selected)):'<p>Adjust the filters to inspect a source.</p>';for(const b of document.querySelectorAll('[data-select]'))b.onclick=()=>{selected=b.dataset.select;renderSplit();};}
function refresh(){if(mode==='workbench')renderSplit();else{$('results').innerHTML=resultContent();bindResults();}}
function bindResults(){for(const b of document.querySelectorAll('[data-source]'))b.onclick=()=>{$('detailBody').innerHTML=evidence(rows.find(r=>r.id===b.dataset.source));$('detail').showModal();};if($('export'))$('export').onclick=()=>{const keys=['id','title','route','assessment','canonical_url'],cell=v=>'"'+String(v).replaceAll('"','""')+'"';const csv=[keys.join(','),...filtered().map(r=>keys.map(k=>cell(r[k])).join(','))].join('\r\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv'})),a=document.createElement('a');a.href=u;a.download='biotasks-sources.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};}
function bind(){for(const b of document.querySelectorAll('[data-audit-domain]'))b.onclick=()=>{mode='inventorySources';render();$('auditDomain').value=b.dataset.auditDomain;renderAuditRows();};for(const b of document.querySelectorAll('[data-format-bar]'))b.onclick=()=>{mode='inventorySources';render();$('auditQuery').value='';$('auditDomain').value='';$('auditStatus').value='';$('auditFormat').value=b.dataset.formatBar;renderAuditRows();$('auditRows').scrollIntoView({block:'start'});};if($('auditDomain')){$('auditQuery').oninput=renderAuditRows;$('auditDomain').onchange=renderAuditRows;$('auditStatus').onchange=renderAuditRows;$('auditFormat').onchange=renderAuditRows;renderAuditRows();}if($('downloadAll'))$('downloadAll').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(rows,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='biotasks-complete-manifest.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};if($('curatedSources'))$('curatedSources').onclick=()=>{mode='workbench';query='raivivek/awesome-biology';route=domain=assessment='';render();};for(const b of document.querySelectorAll('[data-method-route]'))b.onclick=()=>{mode='workbench';route=b.dataset.methodRoute;query=domain=assessment='';render();};for(const b of document.querySelectorAll('[data-layout]'))b.onclick=()=>{mode=b.dataset.layout;view='overview';query=route=domain=assessment='';render();};for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>{view=b.dataset.view;render();};for(const b of document.querySelectorAll('[data-route]'))b.onclick=()=>{route=b.dataset.route;domain=b.dataset.domain;query=assessment='';view='sources';render();};if($('matrixBack'))$('matrixBack').onclick=()=>{view='overview';render();};if($('query')){$('query').oninput=e=>{query=e.target.value;refresh();};for(const k of ['route','domain','assessment'])$(k).onchange=e=>{if(k==='route')route=e.target.value;if(k==='domain')domain=e.target.value;if(k==='assessment')assessment=e.target.value;refresh();};$('reset').onclick=()=>{query=route=domain=assessment='';render();};}bindResults();}
$('closeDetail').onclick=()=>$('detail').close();render();
</script></body></html>
