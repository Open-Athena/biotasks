<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BioTasks — Five ways to explore</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#182b40;font:15px/1.5 system-ui,sans-serif}button,input,select{font:inherit;color:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer}button,input,select{border:1px solid #bdcbd7;background:white;padding:9px 12px;border-radius:6px}button:hover{background:#e8eff8}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #d88a24;outline-offset:2px}a{color:#245ca0}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(28px,4vw,48px);line-height:1.1;letter-spacing:-1.5px}h2{font-size:22px}h3{font-size:17px}.chooser{padding:16px 24px;background:#172b41;color:white}.chooser strong{font-size:13px;text-transform:uppercase;letter-spacing:1px}.choices{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.choices button{background:transparent;color:#dbe7f6;border-color:#577088}.choices button[aria-pressed=true]{background:white;color:#172b41}.chooser p{font-size:13px;color:#bfd1e4;margin:10px 0 0}.shell{max-width:1480px;margin:auto;padding:28px}.topline{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}.brand{font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:700}.muted,small{color:#596d80}.badge{font-size:12px;padding:3px 7px;border-radius:4px;background:#e8edf2;display:inline-block}.apparently_suitable{background:#def2e8;color:#1e6047}.unresolved{background:#fff0cc;color:#785410}.excluded{background:#f4e1e4;color:#7d3548}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:end;padding:18px 0}.controls label{display:grid;gap:4px;font-size:12px}.controls input{min-width:270px}.controls select{max-width:240px}.search-large input{font-size:20px;width:min(680px,100%);padding:16px}.metrics{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.metric{padding:14px 20px;background:white;border:1px solid #dce4ec;border-radius:8px;min-width:130px}.metric b{font-size:30px;display:block}.metric small{display:block}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:white;padding:22px;border:1px solid #dbe3eb;border-radius:12px;display:flex;flex-direction:column;align-items:start;gap:12px}.card p{font-size:13px;margin:0;color:#52677a}.card h3{margin:0}.card button{margin-top:auto}.tags{display:flex;gap:5px;flex-wrap:wrap}.table-wrap{overflow:auto;background:white;border:1px solid #dce4ec;border-radius:8px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:12px;border-bottom:1px solid #e1e7ed;text-align:left;vertical-align:top}th{background:#edf2f7}td button{border:0;background:none;text-align:left;padding:0;color:#245ca0}nav{display:flex;gap:8px;flex-wrap:wrap}nav button[aria-pressed=true]{background:#245ca0;color:white}.note{font-size:13px;padding:12px 0;color:#596d80}.two-col{display:grid;grid-template-columns:minmax(0,2fr) minmax(250px,1fr);gap:24px}.panel{background:white;padding:24px;border:1px solid #dce4ec;border-radius:10px;margin-bottom:20px}.row{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid #e4e9ee;padding:10px 0}.sidebar-layout{display:grid;grid-template-columns:190px minmax(0,1fr);gap:30px}.sidebar{border-right:1px solid #d6dfe8;padding-right:20px}.sidebar nav{display:grid;margin-top:30px}.sidebar nav button{text-align:left}.sidebar .brand{line-height:2}.matrix th{min-width:115px}.matrix th:first-child{min-width:160px}.matrix td{text-align:center}.matrix button{font-variant-numeric:tabular-nums;padding:8px;width:100%;text-align:center}.matrix .positive{background:#dcefe6}.report{max-width:1100px;background:#fbf9f2;color:#302c25;font-family:Georgia,serif;padding:44px;margin:auto}.report h1{font-size:clamp(38px,5vw,68px);font-weight:400;max-width:900px}.report .lead{font-size:22px;max-width:800px}.report .report-head{border-top:4px solid #302c25;border-bottom:1px solid #bfb5a5;padding:30px 0}.report .columns{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin:36px 0}.report h2{font-weight:400;font-size:30px}.report .metric{background:transparent;border:0;border-right:1px solid #bfb5a5;border-radius:0}.report .pull{font-size:28px;line-height:1.3;border-left:4px solid #a5573c;padding-left:20px}.report .controls,.report table,.report button,.report .brand{font-family:system-ui,sans-serif}.workbench{background:#172331;color:#e0e9f1}.workbench .muted,.workbench small,.workbench .note{color:#a7bacb}.workbench input,.workbench select,.workbench button{background:#243649;color:#e0e9f1;border-color:#4c6377}.workbench a{color:#9fcfff}.workbench .controls{padding-top:0}.split{display:grid;grid-template-columns:minmax(240px,1fr) minmax(0,2fr);gap:0;border:1px solid #42576a;min-height:650px}.source-list{max-height:720px;overflow:auto;border-right:1px solid #42576a}.source-list button{display:block;width:100%;border:0;border-radius:0;border-bottom:1px solid #42576a;padding:16px;text-align:left}.source-list button[aria-pressed=true]{background:#354f66;border-left:4px solid #74cbbb}.source-list small{display:block;margin-top:8px}.inspector{padding:28px;min-width:0}.inspector h2{font-size:26px}.inspector dl,dialog dl{display:grid;grid-template-columns:140px minmax(0,1fr);gap:12px}.inspector dd,dialog dd{margin:0;overflow-wrap:anywhere}.inspector dt,dialog dt{font-weight:700}.inspector .badge{color:#183d30}.empty{padding:30px}.result-bar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:12px 0}dialog{width:min(850px,94vw);max-height:88vh;border:1px solid #bdcbd7;border-radius:12px;padding:28px;color:#182b40}dialog::backdrop{background:#14263899}.dialog-head{display:flex;justify-content:space-between;gap:20px}.dialog-head button{align-self:start}.route-bar{height:8px;background:#e9eff4;border-radius:4px;margin-top:6px}.route-bar span{display:block;background:#3979b6;height:100%;border-radius:4px}footer{padding:24px;font-size:12px;color:#596d80;text-align:center}@media(max-width:850px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.sidebar-layout{grid-template-columns:1fr}.sidebar{border:0;padding:0}.sidebar nav{display:flex;margin-top:12px}.two-col,.report .columns{grid-template-columns:1fr}.split{grid-template-columns:1fr}.source-list{max-height:280px;border-right:0;border-bottom:1px solid #42576a}}@media(max-width:550px){.shell,.report{padding:18px}.chooser{padding:14px}.choices button{flex:1;font-size:12px;padding:8px;min-width:100px}.cards{grid-template-columns:1fr}.controls label,.controls input,.controls select{width:100%;max-width:none;min-width:0}.metrics{display:grid;grid-template-columns:1fr 1fr}.metric{min-width:0;padding:10px}.topline{align-items:start}.inspector{padding:16px}.inspector dl,dialog dl{grid-template-columns:1fr}.report .lead{font-size:19px}.result-bar{flex-wrap:wrap}.report h1{letter-spacing:-1px}}
</style></head><body>
<div class="chooser"><strong>Five layouts · one research collection</strong><div class="choices" id="choices"></div><p id="concept"></p></div><main id="app"></main><footer>100 candidates · 98 static inspections · no analyses executed. <a href="https://github.com/Open-Athena/biotasks/issues/16">Issue #16</a></footer><dialog id="detail"><div class="dialog-head"><h2>Source evidence</h2><button id="closeDetail" aria-label="Close source details">Close ×</button></div><div id="detailBody"></div></dialog>
<script>window.BIOTASKS_DATA=__PAYLOAD__;</script><script>
'use strict';
const D=window.BIOTASKS_DATA,rows=D.rows,$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),nice=s=>s.replaceAll('_',' ');
const layouts={catalog:['01 Catalog','Search first. Browse source cards and open evidence on demand.'],dashboard:['02 Dashboard','A compact overview with sidebar navigation, route totals and a table.'],coverage:['03 Coverage atlas','Start with biological coverage, then drill into a route and subdomain.'],report:['04 Research report','Read a narrative synthesis, with the source directory below the findings.'],workbench:['05 Source workbench','Keep a searchable source list beside a persistent evidence inspector.']};
let mode='catalog',query='',route='',domain='',assessment='',selected=rows[0].id,view='overview';
const names=r=>({'github':'GitHub','bioconductor':'Bioconductor','kaggle':'Kaggle','awesome-biology':'Awesome-biology','hugging_face':'Hugging Face','quarto':'Quarto','marimo':'marimo'}[r]||nice(r));
const badge=r=>`<span class="badge ${r.assessment}">${esc(nice(r.assessment))}</span>`;
const brand='<span class="brand">BioTasks / Analysis discovery</span>';
const note='<p class="note">Suitability is based on static source review. It does not establish reproducibility, scientific validity or reuse permission.</p>';
function filtered(){return rows.filter(r=>(!query||JSON.stringify(r).toLowerCase().includes(query.toLowerCase()))&&(!route||r.route===route)&&(!domain||r.subdomains.includes(domain))&&(!assessment||r.assessment===assessment));}
function metrics(){return '<div class="metrics">'+[[100,'documents'],[70,'apparently suitable'],[19,'unresolved'],[11,'excluded']].map(([n,l])=>`<div class="metric"><b>${n}</b><small>${l}</small></div>`).join('')+'</div>';}
function controls(){const opts=(vals,value,label)=>`<option value="">${label}</option>`+vals.map(([k,v])=>`<option value="${esc(k)}" ${value===k?'selected':''}>${esc(v)}</option>`).join('');return `<div class="controls"><label>Search documents<input id="query" value="${esc(query)}" placeholder="Biology, tool, dataset…"></label><label>Discovery route<select id="route">${opts(Object.keys(D.summary.routes).map(k=>[k,names(k)]),route,'All routes')}</select></label><label>Biology<select id="domain">${opts(D.domains.map(k=>[k,k]),domain,'All subdomains')}</select></label><label>Assessment<select id="assessment">${opts(['apparently_suitable','unresolved','excluded'].map(k=>[k,nice(k)]),assessment,'All assessments')}</select></label><button id="reset">Reset</button></div>`;}
function evidence(r){return `<p>${badge(r)} <small>${esc(r.id)} · ${esc(nice(r.review_stage))}</small></p><h2>${esc(r.title)}</h2><p><a href="${esc(r.canonical_url)}" target="_blank" rel="noopener">Open original source ↗</a></p><dl>${[['Assessment',r.assessment_reason],['Biology',r.subdomains.join(', ')],['Workflow',r.workflow],['Inputs',r.input_evidence],['Lineage',r.lineage],['Dependencies',r.dependencies],['Code terms',r.code_terms],['Data terms',r.data_terms],['Study cluster',r.study_cluster],['Source revision',r.source_revision||r.source_version||'Not pinned'],['Source hash',r.source_sha256||'Not captured']].map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;}
function table(rs){return `<div class="table-wrap"><table><thead><tr><th>Source</th><th>Biology / workflow</th><th>Route</th><th>Assessment</th></tr></thead><tbody>${rs.map(r=>`<tr><td><small>${esc(r.id)}</small><br><button data-source="${r.id}">${esc(r.title)}</button></td><td>${esc(r.subdomains.join(', '))}<br><small>${esc(r.workflow)}</small></td><td>${esc(names(r.route))}</td><td>${badge(r)}</td></tr>`).join('')}</tbody></table></div>`;}
function cards(rs){return '<div class="cards">'+rs.map(r=>`<article class="card"><small>${esc(names(r.route))} · ${r.id}</small><h3>${esc(r.title)}</h3>${badge(r)}<p>${esc(r.workflow)}</p><div class="tags">${r.subdomains.map(d=>`<span class="badge">${esc(d)}</span>`).join('')}</div><button data-source="${r.id}">Inspect evidence ↗</button></article>`).join('')+'</div>';}
function resultContent(){const rs=filtered();return `<div class="result-bar"><span>${rs.length} documents · ${rs.filter(r=>r.assessment==='apparently_suitable').length} apparently suitable</span><button id="export">Export these sources</button></div>`+(rs.length?(mode==='catalog'?cards(rs):table(rs)):'<p class="empty">No documents match. Adjust the filters or reset them.</p>');}
function directory(){return controls()+'<div id="results">'+resultContent()+'</div>';}
function coverage(){const gs=Object.entries(D.summary.routes);return '<p>Cells show apparently suitable / statically inspected documents. Click any cell to inspect its sources. Biology labels overlap.</p><div class="table-wrap"><table class="matrix"><thead><tr><th>Biology</th>'+gs.map(([k])=>`<th>${esc(names(k))}</th>`).join('')+'</tr></thead><tbody>'+D.domains.map(d=>`<tr><th>${esc(d)}</th>`+gs.map(([k,v])=>`<td class="${v.coverage[d].apparently_suitable?'positive':''}"><button data-route="${k}" data-domain="${d}">${v.coverage[d].apparently_suitable} / ${v.coverage[d].reviewed}</button></td>`).join('')+'</tr>').join('')+'</tbody></table></div>';}
function routes(){return Object.entries(D.summary.routes).map(([k,v])=>`<div class="row"><div>${esc(names(k))}<div class="route-bar"><span style="width:${100*(v.statuses.apparently_suitable||0)/v.identified}%"></span></div></div><strong>${v.statuses.apparently_suitable||0} / ${v.identified}</strong></div>`).join('');}
function nav(){return '<nav>'+[['overview','Overview'],['sources','Source directory'],['coverage','Coverage']].map(([k,t])=>`<button data-view="${k}" aria-pressed="${view===k}">${t}</button>`).join('')+'</nav>';}
function render(){let content='';$('concept').textContent=layouts[mode][1];$('choices').innerHTML=Object.entries(layouts).map(([k,v])=>`<button data-layout="${k}" aria-pressed="${k===mode}">${v[0]}</button>`).join('');
if(mode==='catalog')content=`<div class="shell"><div class="topline">${brand}<small>100 sources / 13 biology labels</small></div><h1>Find an analysis to build on.</h1><p class="muted">Search the collection, compare workflows, and inspect the evidence behind each assessment.</p>${directory()}${note}</div>`;
if(mode==='dashboard')content=`<div class="shell sidebar-layout"><aside class="sidebar">${brand}${nav()}${note}</aside><div><div class="topline"><h1>${view==='overview'?'Discovery dashboard':view==='sources'?'Source directory':'Biological coverage'}</h1></div>${view==='overview'?metrics()+`<div class="two-col"><div class="panel"><h2>Route composition</h2><p class="muted">Suitable / identified. These are descriptive counts, not platform rankings.</p>${routes()}</div><div><div class="panel"><h2>Review status</h2><p>98 documents inspected; 2 access-only leads.</p><p>19 assessments remain unresolved.</p><button data-view="sources">Browse the evidence →</button></div><div class="panel"><h2>Study reuse</h2><p>PBMC3k, AdK, HMS and faahKO recur. Document counts exceed independent-study coverage.</p></div></div></div>`:view==='sources'?directory():coverage()}</div></div>`;
if(mode==='coverage')content=`<div class="shell"><div class="topline">${brand}<button id="matrixBack">Show full matrix</button></div><h1>Where is the biology covered?</h1>${view==='sources'?`<p class="muted">Sources for the selected matrix cell. Change filters to explore nearby workflows.</p>${directory()}`:coverage()}${note}</div>`;
if(mode==='report')content=`<article class="report"><div class="topline">${brand}<a href="#reportDirectory">Go to sources ↓</a></div><div class="report-head"><p>Research synthesis / 100 analysis documents</p><h1>A field guide to computational biology analyses</h1><p class="lead">Useful analyses appear across challenges, package documentation and curated indexes. Finding the code is only the first step.</p></div>${metrics()}<div class="columns"><div><h2>Follow the biological question</h2><p>Biology challenges provide useful entry points for Kaggle discovery, connecting notebooks with named datasets. Package documentation adds complementary workflows, from differential expression to phenotyping and metabolomics.</p><p>Curated indexes become useful when followed through to actual documents. The collection includes analyses linked through awesome-biology and DREAM projects.</p></div><div><h2>Follow the inputs, too</h2><p>Geneformer and DREAM examples retain unresolved processed inputs or model assets. Two Kaggle leads remain access-only. Some analytical workflows have unclear biological relevance.</p><p class="pull">100 documents do not mean 100 independent studies.</p><p>Shared datasets recur across tutorials. The 70 suitable documents have 54 provisional study-cluster labels, not 54 verified independent studies.</p></div></div>${note}<section id="reportDirectory"><h2>The source directory</h2>${directory()}</section></article>`;
if(mode==='workbench')content=`<div class="workbench"><div class="shell"><div class="topline">${brand}<small>Source inspector / 100 documents</small></div><h1 style="font-size:26px;letter-spacing:-.5px">Analysis workbench</h1>${controls()}<div class="split"><div class="source-list" id="sourceList"></div><article class="inspector" id="inspector"></article></div>${note}</div></div>`;
$('app').innerHTML=content;bind();if(mode==='workbench')renderSplit();}
function renderSplit(){const rs=filtered();if(!rs.some(r=>r.id===selected))selected=rs[0]?.id;$('sourceList').innerHTML=rs.length?rs.map(r=>`<button data-select="${r.id}" aria-pressed="${r.id===selected}">${esc(r.title)}<small>${r.id} · ${esc(names(r.route))} · ${esc(nice(r.assessment))}</small></button>`).join(''):'<p class="empty">No matching documents.</p>';$('inspector').innerHTML=selected?evidence(rs.find(r=>r.id===selected)):'<p>Adjust the filters to inspect a source.</p>';for(const b of document.querySelectorAll('[data-select]'))b.onclick=()=>{selected=b.dataset.select;renderSplit();};}
function refresh(){if(mode==='workbench')renderSplit();else{$('results').innerHTML=resultContent();bindResults();}}
function bindResults(){for(const b of document.querySelectorAll('[data-source]'))b.onclick=()=>{$('detailBody').innerHTML=evidence(rows.find(r=>r.id===b.dataset.source));$('detail').showModal();};if($('export'))$('export').onclick=()=>{const keys=['id','title','route','assessment','canonical_url'],cell=v=>'"'+String(v).replaceAll('"','""')+'"';const csv=[keys.join(','),...filtered().map(r=>keys.map(k=>cell(r[k])).join(','))].join('\r\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv'})),a=document.createElement('a');a.href=u;a.download='biotasks-sources.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};}
function bind(){for(const b of document.querySelectorAll('[data-layout]'))b.onclick=()=>{mode=b.dataset.layout;view='overview';query=route=domain=assessment='';render();};for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>{view=b.dataset.view;render();};for(const b of document.querySelectorAll('[data-route]'))b.onclick=()=>{route=b.dataset.route;domain=b.dataset.domain;query=assessment='';view='sources';render();};if($('matrixBack'))$('matrixBack').onclick=()=>{view='overview';render();};if($('query')){$('query').oninput=e=>{query=e.target.value;refresh();};for(const k of ['route','domain','assessment'])$(k).onchange=e=>{if(k==='route')route=e.target.value;if(k==='domain')domain=e.target.value;if(k==='assessment')assessment=e.target.value;refresh();};$('reset').onclick=()=>{query=route=domain=assessment='';render();};}bindResults();}
$('closeDetail').onclick=()=>$('detail').close();render();
</script></body></html>
