function metrics(){return '<div class="metrics">'+[[100,'documents'],[70,'apparently suitable'],[19,'unresolved'],[11,'excluded']].map(([n,l])=>`<div class="metric"><b>${n}</b><small>${l}</small></div>`).join('')+'</div>';}
function controls(){const opts=(vals,value,label)=>`<option value="">${label}</option>`+vals.map(([k,v])=>`<option value="${esc(k)}" ${value===k?'selected':''}>${esc(v)}</option>`).join('');return `<div class="controls"><label>Search documents<input id="query" value="${esc(query)}" placeholder="Biology, tool, dataset…"></label><label>Discovery route<select id="route">${opts(Object.keys(D.summary.routes).map(k=>[k,names(k)]),route,'All routes')}</select></label><label>Biology<select id="domain">${opts(D.domains.map(k=>[k,k]),domain,'All subdomains')}</select></label><label>Assessment<select id="assessment">${opts(['apparently_suitable','unresolved','excluded'].map(k=>[k,nice(k)]),assessment,'All assessments')}</select></label><button id="reset">Reset</button></div>`;}
function formatValue(value,key){if(Array.isArray(value))return value.length?'<ul>'+value.map(v=>'<li>'+formatValue(v,key)+'</li>').join('')+'</ul>':'None recorded';if(value&&typeof value==='object')return '<pre style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(JSON.stringify(value,null,2))+'</pre>';if(key==='evidence')return `<a href="https://github.com/Open-Athena/biotasks/blob/codex/research/16-analysis-discovery/experiments/16-analysis-discovery/${esc(value)}" target="_blank" rel="noopener">${esc(value)} ↗</a>`;if(/^https?:\/\//.test(String(value)))return `<a href="${esc(value)}" target="_blank" rel="noopener">${esc(value)} ↗</a>`;return esc(value);}
function projectProvenance(r){const g=D.tool_provenance.groups.find(g=>g.ids.includes(r.id));return g?`<section><h3>Discovery provenance</h3><p><strong>${esc(g.project)}:</strong> ${esc(g.entry)}</p>${g.query?'<p><code>'+esc(g.query)+'</code></p>':''}<p>${esc(g.documents)}</p><p class="muted">${esc(g.limit)}</p></section>`:'';}
function evidence(r){return `${projectProvenance(r)}<p>${badge(r)} <small>${esc(r.id)} · ${esc(nice(r.review_stage))}</small></p><h2>${esc(r.title)}</h2><p><a href="${esc(r.canonical_url)}" target="_blank" rel="noopener">Open original source ↗</a></p><dl>${[['Assessment',r.assessment_reason],['Biology',r.subdomains.join(', ')],['Workflow',r.workflow],['Inputs',r.input_evidence],['Lineage',r.lineage],['Dependencies',r.dependencies],['Code terms',r.code_terms],['Data terms',r.data_terms],['Study cluster',r.study_cluster],['Source revision',r.source_revision||r.source_version||'Not pinned'],['Source hash',r.source_sha256||'Not captured']].map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl><details><summary>Complete source record — all metadata</summary><dl>${Object.entries(r).map(([k,v])=>`<dt>${esc(nice(k))}</dt><dd>${formatValue(v,k)}</dd>`).join('')}</dl></details>`;}
function table(rs){return `<div class="table-wrap"><table><thead><tr><th>Source</th><th>Biology / workflow</th><th>Route</th><th>Assessment</th></tr></thead><tbody>${rs.map(r=>`<tr><td><small>${esc(r.id)}</small><br><button data-source="${r.id}">${esc(r.title)}</button></td><td>${esc(r.subdomains.join(', '))}<br><small>${esc(r.workflow)}</small></td><td>${esc(names(r.route))}</td><td>${badge(r)}</td></tr>`).join('')}</tbody></table></div>`;}
function cards(rs){return '<div class="cards">'+rs.map(r=>`<article class="card"><small>${esc(names(r.route))} · ${r.id}</small><h3>${esc(r.title)}</h3>${badge(r)}<p>${esc(r.workflow)}</p><div class="tags">${r.subdomains.map(d=>`<span class="badge">${esc(d)}</span>`).join('')}</div><button data-source="${r.id}">Inspect evidence ↗</button></article>`).join('')+'</div>';}
function resultContent(){const rs=filtered();return `<div class="result-bar"><span>${rs.length} documents · ${rs.filter(r=>r.assessment==='apparently_suitable').length} apparently suitable</span><button id="export">Export these sources</button></div>`+(rs.length?(mode==='catalog'?cards(rs):table(rs)):'<p class="empty">No documents match. Adjust the filters or reset them.</p>');}
function directory(){return controls()+'<div id="results">'+resultContent()+'</div>';}
function coverage(){const gs=Object.entries(D.summary.routes);return '<p>Cells show apparently suitable / statically inspected documents. Click any cell to inspect its sources. Biology labels overlap.</p><div class="table-wrap"><table class="matrix"><thead><tr><th>Biology</th>'+gs.map(([k])=>`<th>${esc(names(k))}</th>`).join('')+'</tr></thead><tbody>'+D.domains.map(d=>`<tr><th>${esc(d)}</th>`+gs.map(([k,v])=>`<td class="${v.coverage[d].apparently_suitable?'positive':''}"><button data-route="${k}" data-domain="${d}">${v.coverage[d].apparently_suitable} / ${v.coverage[d].reviewed}</button></td>`).join('')+'</tr>').join('')+'</tbody></table></div><section class="panel" style="margin-top:24px"><h2>Interpreting coverage</h2><p>Document counts do not establish independent-study breadth. PBMC3k, AdK, HMS and faahKO recur across sources. The 70 apparently suitable documents have 54 provisional study-cluster labels, not 54 verified independent studies.</p><p>Geneformer and DREAM examples retain unresolved processed inputs or model assets. Two Kaggle leads remain access-only; some analytical workflows have unclear biological relevance. Inspect individual source records for the evidence behind each assessment.</p></section>';}
function routes(){return Object.entries(D.summary.routes).map(([k,v])=>`<div class="row"><div>${esc(names(k))}<div class="route-bar"><span style="width:${100*(v.statuses.apparently_suitable||0)/v.identified}%"></span></div></div><strong>${v.statuses.apparently_suitable||0} / ${v.identified}</strong></div>`).join('');}
function nav(){return '<nav>'+[['overview','Overview'],['sources','Source directory'],['coverage','Coverage']].map(([k,t])=>`<button data-view="${k}" aria-pressed="${view===k}">${t}</button>`).join('')+'</nav>';}
const routeMethods={
'github':['Repository search','Biology-focused web searches → repository files → notebook source. Includes challenge-code repositories.'],
'kaggle':['Biology challenges','Find biological competitions → linked notebooks → source and dataset references. Includes CAFA, OpenVaccine, single-cell perturbations, plant pathology and HMS; generic-search access failures remain recorded.'],
'bioconductor':['Workflows and vignettes','Workflow/package indexes → rendered analyses → upstream R Markdown when source recovery is needed. Release pages and upstream revisions are not assumed identical.'],
'awesome-biology':['Curated tool links','awesome-biology → tool documentation → scikit-bio, Bio.Phylo, Scanpy and EBImage analyses.'],
'challenge_project':['Challenge project links','awesome-biology → DREAM → olfaction project → paper analysis notebooks.'],
'gallery':['Gallery search','Biology-targeted marimo gallery query → CAZyLingua analysis lead.'],
'hugging_face':['Model-repository notebooks only','Two selected Geneformer example notebooks from one model repository. This sample does not cover Hugging Face articles or Spaces; see the additional discovery surfaces below.'],
'marimo':['Example pipeline','marimo example catalog → PBMC3k Scanpy pipeline; mirrors are aliases and study reuse is flagged.'],
'quarto':['Analysis catalogs','Primary repository/documentation catalogs → Quarto GWAS, microbiome and RNA-seq analyses.'],
'teaching':['Teaching resources','Targeted Quarto ecology search → reporting lesson → upstream input checks.'],
'tool_documentation':['Select a project, then inspect its tutorials','PlantCV and MDAnalysis were named in targeted searches; Scirpy was opened directly; OpenScope surfaced in an Allen/Neuromatch search. These four catalogs supplied all 28 documents in this group.']};
function methodsPage(){return `<div class="shell"><div class="topline">${brand}<button id="downloadAll">Download complete manifest</button></div><h1>How the source collection was built</h1><p class="muted">A map of the discovery methods, source families and screening decisions behind all 100 candidate documents.</p><section class="panel" id="candidateDefinition"><h2>What is a candidate?</h2><p><strong>One specific analysis document selected for screening and recorded in this collection.</strong> It may be a notebook, a vignette, an R Markdown/Quarto analysis or a worked tutorial. A repository, search result page or curated list is usually a discovery lead, not itself a candidate. A candidate is not necessarily suitable or runnable: excluded, unresolved and access-only documents remain in the collection.</p><p>For example, two different notebooks from the same repository can be two candidates. Confirmed mirrors of one document count once, with aliases. Different documents using the same dataset remain separate documents, with study reuse flagged.</p><p><strong>“GitHub: 12” means 12 selected documents assigned to that discovery route in this collection—not only 12 notebooks available on GitHub.</strong> Other routes can also lead to GitHub-hosted files. We have not measured the total pool, exhausted repository search or estimated recall. All route counts below describe our selected sample.</p></section><section class="panel" id="toolProvenance"><h2>How did we find the tools?</h2><p><strong>Project discovery → selected project → analysis-document retrieval.</strong> “Tool documentation” describes the last step, not the first. The group below is now labeled “Selected-tool tutorial inspection”; most of it started from tool names supplied in searches or opened directly.</p><div class="table-wrap"><table><thead><tr><th>Project</th><th>How we reached it</th><th>Where documents came from</th><th>Selection limits</th></tr></thead><tbody>${D.tool_provenance.groups.map(g=>`<tr><th>${esc(g.project)}<br><small>${g.ids.length} selected documents</small></th><td>${esc(g.entry)}${g.query?'<p><code>'+esc(g.query)+'</code></p>':''}</td><td>${esc(g.documents)}</td><td>${esc(g.limit)}</td></tr>`).join('')}</tbody></table></div><p><strong>24 of 28 looked suitable within four selected project catalogs.</strong> This supports inspecting these catalogs, not a claim that “tool documentation” is the best discovery route. It does not measure how efficiently unfamiliar tools can be found or how broadly the catalogs cover independent studies.</p></section><h2>Discovery map: routes used in this collection</h2><p class="muted">Cards preserve the collection’s recorded groupings, which mix discovery methods, hosting and document types; they are not equivalent independent search channels. For each source, distinguish how the project was found from where its document was retrieved. For example, a curated list may lead to GitHub code, and a Quarto document may be hosted by a tool project.</p><div class="method-map">${Object.entries(D.summary.routes).map(([k,v])=>`<button class="method-node" data-method-route="${k}"><span class="brand">${esc(names(k))}</span><h3>${esc(routeMethods[k][0])}</h3><p>${esc(routeMethods[k][1])}</p><small>${v.identified} selected for this collection · ${v.reviewed} inspected · ${v.statuses.apparently_suitable||0} apparently suitable</small><span class="node-link">Inspect sources →</span></button>`).join('')}</div><div class="flow-arrow" aria-hidden="true">↓</div><div class="method-flow"><article><span class="brand">01 / Identify</span><h3>Resolve actual documents</h3><p>Follow indexes and repositories to notebooks, vignettes, R Markdown or Quarto documents. Record the canonical URL, hosting, format and discovery path.</p></article><article><span class="brand">02 / Recover</span><h3>Inspect source evidence</h3><p>Recover readable source; retain revision and hash when available. Trace input paths, dependencies and source terms. Access-only leads stay visible.</p></article><article><span class="brand">03 / Reconcile</span><h3>Track mirrors and study reuse</h3><p>Confirmed mirrors are aliases. Shared datasets form study clusters, not automatic document duplicates. Biological labels may overlap.</p></article><article><span class="brand">04 / Screen</span><h3>Assess analytical suitability</h3><p>Look for a biological question, meaningful analytical choices, specific inputs and identifiable dependencies. Missing evidence remains unresolved.</p></article></div><div class="flow-arrow" aria-hidden="true">↓</div>${metrics()}<p class="note">98 substantive static inspections + 2 access-only leads = 100 candidates. Assessments cover all 100; the two access-only leads are unresolved. No analyses have been executed.</p><section class="panel" id="hfSurfaces"><h2>Hugging Face: separate discovery surfaces</h2><p>The two HF candidates above are model-repository notebooks. They are not a representative survey of Hugging Face. Platform documentation confirms additional surfaces; their biological content has not yet been systematically screened for this collection.</p><div class="table-wrap"><table><thead><tr><th>Surface</th><th>What it can contain</th><th>Coverage in this collection</th></tr></thead><tbody><tr><td>Repository notebooks</td><td>Notebook files alongside model assets; notebook viewing and external Colab/Kaggle launch links.</td><td>Two Geneformer notebooks selected; both unresolved.</td></tr><tr><td><a href="https://huggingface.co/docs/hub/blog-articles" target="_blank" rel="noopener">Blog articles / tutorials ↗</a></td><td>Standalone long-form write-ups that can reference models, datasets and Spaces. A post may be a worked analysis, or a lead to linked code; being a blog does not make it executable.</td><td>No systematic biology-article search or candidate screening yet. This does not mean no relevant articles exist.</td></tr><tr><td><a href="https://huggingface.co/docs/hub/spaces-overview" target="_blank" rel="noopener">Spaces / interactive pages ↗</a></td><td>Hosted apps or pages built with Gradio, Docker or static HTML. Inspect the source and biological workflow behind the interface; an interactive demo alone does not establish a reproducible analysis.</td><td>No systematic biological Spaces search or candidate screening yet. No apps launched or computations requested.</td></tr></tbody></table></div><p class="note">An article linking a notebook and a Space may represent one analysis or several distinct artifacts. Trace the content and aliases before counting; do not count each URL as an independent analysis. <a href="https://huggingface.co/docs/hub/notebooks" target="_blank" rel="noopener">HF notebook documentation ↗</a></p></section><div class="two-col"><section class="panel"><h2>Selection and coverage</h2><p>This is a purposive collection, not a random sample or an exhaustive crawl. Searches combine biology-focused queries, competition-first discovery, package indexes, curated links and targeted workflow searches.</p><p>Thirteen overlapping biology labels describe coverage; workflow labels describe the analytical activity. Route totals do not measure platform yield because selection effort and source availability differ.</p><p>Systematic paper-to-code searches, citation following, other challenge platforms and multilingual resources remain untested.</p></section><section class="panel"><h2>Evidence boundaries</h2><p>Input lineage distinguishes observed, adapted, predicted and simulated material. Input locations were traced; analyses were not executed. Source recovery does not validate scientific conclusions.</p><p>Code, document, data and model terms are separate. Static suitability does not establish redistribution permission. Per-candidate manual review effort was not fully tracked.</p><p>Assessments are assistant judgments, not independent validation. “Excluded” applies to the document screened, not the underlying tool.</p></section></div><section class="panel"><h2>Reproduce and inspect</h2><p>The normalized manifest exposes every recorded candidate field. Source details include discovery paths, aliases, input datasets, popularity observations, revisions, hashes and links to evidence files wherever recorded.</p><p><a href="https://github.com/Open-Athena/biotasks/tree/codex/research/16-analysis-discovery/experiments/16-analysis-discovery" target="_blank" rel="noopener">Research artifacts and builders ↗</a> · <a href="https://github.com/Open-Athena/biotasks/blob/codex/research/16-analysis-discovery/experiments/16-analysis-discovery/protocol.md" target="_blank" rel="noopener">Detailed protocol ↗</a></p>${note}</section></div>`;}
function curatedPage(){return `<div class="shell">${brand}<h1 style="margin-top:24px">The curated source index</h1><p><a href="https://github.com/raivivek/awesome-biology/blob/deb849cea4c67bbcd2a4a81c4d014888f357831e/README.md">Pinned awesome-biology index ↗</a></p><p>${D.awesome.inventory.length} bullet-link entries; ${new Set(D.awesome.inventory.map(x=>x.url)).size} distinct literal URLs. These are resources, not counts of analysis documents.</p><button id="curatedSources">Inspect all linked candidates →</button><h2 style="margin-top:28px">Resource inventory</h2><div class="table-wrap"><table><thead><tr><th>Section</th><th>Resource</th></tr></thead><tbody>${D.awesome.inventory.map(x=>`<tr><td>${esc(x.section)}</td><td><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></td></tr>`).join('')}</tbody></table></div></div>`;}
function render(){let content='';$('concept').textContent=layouts[mode][1];$('choices').innerHTML=Object.entries(layouts).map(([k,v])=>`<button data-layout="${k}" aria-pressed="${k===mode}">${v[0]}</button>`).join('');
if(mode==='methods')content=methodsPage();if(mode==='curated')content=curatedPage();
if(mode==='catalog')content=`<div class="shell"><div class="topline">${brand}<small>100 sources / 13 biology labels</small></div><h1>Find an analysis to build on.</h1><p class="muted">Search the collection, compare workflows, and inspect the evidence behind each assessment.</p>${directory()}${note}</div>`;
if(mode==='dashboard')content=`<div class="shell sidebar-layout"><aside class="sidebar">${brand}${nav()}${note}</aside><div><div class="topline"><h1>${view==='overview'?'Discovery dashboard':view==='sources'?'Source directory':'Biological coverage'}</h1></div>${view==='overview'?metrics()+`<div class="two-col"><div class="panel"><h2>Route composition</h2><p class="muted">Suitable / identified. These are descriptive counts, not platform rankings.</p>${routes()}</div><div><div class="panel"><h2>Review status</h2><p>98 documents inspected; 2 access-only leads.</p><p>19 assessments remain unresolved.</p><button data-view="sources">Browse the evidence →</button></div><div class="panel"><h2>Study reuse</h2><p>PBMC3k, AdK, HMS and faahKO recur. Document counts exceed independent-study coverage.</p></div></div></div>`:view==='sources'?directory():coverage()}</div></div>`;
if(mode==='coverage')content=`<div class="shell"><div class="topline">${brand}<button id="matrixBack">Show full matrix</button></div><h1>Where is the biology covered?</h1>${view==='sources'?`<p class="muted">Sources for the selected matrix cell. Change filters to explore nearby workflows.</p>${directory()}`:coverage()}${note}</div>`;
if(mode==='workbench')content=`<div class="workbench"><div class="shell"><div class="topline">${brand}<small>Source inspector / 100 documents</small></div><h1 style="font-size:26px;letter-spacing:-.5px">Analysis workbench</h1>${controls()}<div class="split"><div class="source-list" id="sourceList"></div><article class="inspector" id="inspector"></article></div>${note}</div></div>`;
$('app').innerHTML=content;bind();if(mode==='workbench')renderSplit();}
function renderSplit(){const rs=filtered();if(!rs.some(r=>r.id===selected))selected=rs[0]?.id;$('sourceList').innerHTML=rs.length?rs.map(r=>`<button data-select="${r.id}" aria-pressed="${r.id===selected}">${esc(r.title)}<small>${r.id} · ${esc(names(r.route))} · ${esc(nice(r.assessment))}</small></button>`).join(''):'<p class="empty">No matching documents.</p>';$('inspector').innerHTML=selected?evidence(rs.find(r=>r.id===selected)):'<p>Adjust the filters to inspect a source.</p>';for(const b of document.querySelectorAll('[data-select]'))b.onclick=()=>{selected=b.dataset.select;renderSplit();};}
function refresh(){if(mode==='workbench')renderSplit();else{$('results').innerHTML=resultContent();bindResults();}}
function bindResults(){for(const b of document.querySelectorAll('[data-source]'))b.onclick=()=>{$('detailBody').innerHTML=evidence(rows.find(r=>r.id===b.dataset.source));$('detail').showModal();};if($('export'))$('export').onclick=()=>{const keys=['id','title','route','assessment','canonical_url'],cell=v=>'"'+String(v).replaceAll('"','""')+'"';const csv=[keys.join(','),...filtered().map(r=>keys.map(k=>cell(r[k])).join(','))].join('\r\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv'})),a=document.createElement('a');a.href=u;a.download='biotasks-sources.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};}
function bind(){if($('downloadAll'))$('downloadAll').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(rows,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='biotasks-complete-manifest.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};if($('curatedSources'))$('curatedSources').onclick=()=>{mode='workbench';query='raivivek/awesome-biology';route=domain=assessment='';render();};for(const b of document.querySelectorAll('[data-method-route]'))b.onclick=()=>{mode='workbench';route=b.dataset.methodRoute;query=domain=assessment='';render();};for(const b of document.querySelectorAll('[data-layout]'))b.onclick=()=>{mode=b.dataset.layout;view='overview';query=route=domain=assessment='';render();};for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>{view=b.dataset.view;render();};for(const b of document.querySelectorAll('[data-route]'))b.onclick=()=>{route=b.dataset.route;domain=b.dataset.domain;query=assessment='';view='sources';render();};if($('matrixBack'))$('matrixBack').onclick=()=>{view='overview';render();};if($('query')){$('query').oninput=e=>{query=e.target.value;refresh();};for(const k of ['route','domain','assessment'])$(k).onchange=e=>{if(k==='route')route=e.target.value;if(k==='domain')domain=e.target.value;if(k==='assessment')assessment=e.target.value;refresh();};$('reset').onclick=()=>{query=route=domain=assessment='';render();};}bindResults();}
$('closeDetail').onclick=()=>$('detail').close();render();
</script></body></html>
