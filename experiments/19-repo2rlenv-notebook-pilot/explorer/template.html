<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BioTasks · Notebook → task</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#182b40;font:14px/1.55 system-ui,sans-serif}a{color:#245ca0;text-underline-offset:3px;overflow-wrap:anywhere}button,input,select{font:inherit;color:inherit;border:1px solid #bdcbd7;background:white;padding:9px 12px;border-radius:4px}button,summary{cursor:pointer}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #d88a24;outline-offset:3px}[hidden]{display:none!important}header{border-bottom:1px solid #dce4ec;background:white}header>div{max-width:1240px;margin:auto;padding:15px 24px;display:flex;justify-content:space-between;gap:20px}.brand{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700}main{max-width:1240px;margin:auto;padding:28px 24px}h1{font-size:30px;letter-spacing:-.7px;line-height:1.2;margin:16px 0}h2{font-size:25px;line-height:1.25}h3{font-size:16px;margin-top:26px}.muted,.status,.meta,.count,small,.viewer-help{color:#596d80}.status,.meta,.viewer-help{font-size:12px}.metrics{display:flex;gap:24px;padding:15px 0;border-top:1px solid #dce4ec;border-bottom:1px solid #dce4ec;margin:22px 0}.metrics b{font:600 24px/1.3 ui-monospace,monospace;margin-right:7px}.toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin:20px 0}label{display:grid;gap:5px;font-size:12px}.search{flex:1;min-width:200px}input,select{width:100%}.table-wrap{overflow:auto;background:white;border:1px solid #dce4ec}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:15px;border-bottom:1px solid #e1e7ed;vertical-align:top}th{background:#edf2f7;font-size:11px;text-transform:uppercase;letter-spacing:.5px}td:first-child{width:44%}td a{font-weight:600;font-size:15px}td small{display:block;margin-top:5px}.pill{font-size:11px;padd e:pre;max-width:100%}.markdown pre code{padding:0;background:none;white-space:pre}.markdown table{display:block;overflow:auto;max-width:100%;margin:18px 0}.markdown td:first-child{width:auto}.markdown blockquote{border-left:3px solid #9ab3ce;margin-left:0;padding-left:18px;color:#596d80}.markdown img{max-width:100%;height:auto}@media(max-width:650px){.markdown th:nth-child(3),.markdown td:nth-child(3){display:table-cell}}.task-card{border:1px solid #dce4ec;border-radius:6px;margin:24px 0;overflow:hidden}.task-card>h2{font-size:20px;margin:18px 20px 6px}.task-card>.status{margin:0 20px 16px}.artifact-scroll{height:390px;overflow:auto;padding:18px 20px;border-top:1px solid #dce4ec;border-bottom:1px solid #dce4ec;background:#fafbfd;overscroll-behavior:contain}.artifact-scroll:focus-visible{outline:3px solid #d88a24;outline-offset:-3px}.artifact-scroll pre{margin:0;background:transparent;padding:0;white-space:pre;overflow:visible}.artifact-scroll .markdown>:first-child{margin-top:0}.annotations{padding:18px 20px}.annotations h3{margin:0 0 10px;font-size:14px}.annotations p{margin:0 0 10px}.annotations ul{margin-bottom:0;padding-left:20px}@media(max-width:650px){.artifact-scroll{height:320px;padding:14px}.annotations{padding:14px}}.artifact-scroll{background:#e5eef8;border-top:1px solid #8098b4;border-bottom:1px solid #8098b4;border-left:4px solid #507cad}.annotations{background:#fff}.task-card{border-color:#aabace}.artifact-scroll.code-surface,.syntax-code,.markdown pre{background:#272822;color:#f8f8f2}.artifact-scroll.code-surface{border-color:#505461;border-left-color:#8f9aaa}.syntax-code code,.markdown pre code{background:transparent;color:inherit;padding:0}.syntax-code{tab-size:4;white-space:pre;overflow:auto}.markdown pre{padding:14px;border-radius:4px}.artifact-scroll .syntax-code{background:transparent}.approach-grid{display:grid;grid-template-columns:1fr;gap:20px;margin:24px 0}.approach-card{min-width:0;background:white;border:1px solid #aabace;padding:20px;border-radius:6px}.approach-card h2{margin:0}.approach-flow{list-style:none;padding:0;margin:20px 0}.approach-flow li{position:relative;border-left:3px solid #507cad;background:#e5eef8;padding:12px 14px;margin-bottom:22px}.approach-flow li:not(:last-child)::after{content:"↓";position:absolute;bottom:-23px;left:14px;color:#507cad}.approach-flow span{display:block;color:#596d80;font-size:12px;text-transform:uppercase;letter-spacing:.6px}.approach-flow strong{display:block;margin-top:4px}.approach-flow p{margin:6px 0 0}.approach-card details{margin-top:14px}.approach-card .links{font-size:12px}#notebook-list{scroll-margin-top:20px;border-top:1px solid #bdcbd7;padding-top:26px}@media(max-width:760px){.approach-grid{grid-template-columns:1fr}.approach-card{padding:16px}}.approach-flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}.approach-flow li{border:0;background:none;padding:0;margin:0;min-width:0}.approach-flow li:not(:last-child)::after{content:"→";left:auto;right:-18px;top:35%;bottom:auto}.approach-flow button{width:100%;height:100%;text-align:left;background:#edf2f7;min-height:95px}.approach-flow button[aria-pressed=true]{background:#245ca0;color:white;border-color:#245ca0}.approach-flow button[aria-pressed=true] span{color:#e7effa}.approach-step-panel{border-top:2px solid #507cad;padding-top:14px}.approach-step-panel>h3{font-size:21px;margin:0 0 10px}.approach-step-panel select{display:block;margin:8px 0 16px;max-width:100%}@media(max-width:760px){.approach-flow{grid-template-columns:1fr 1fr}.approach-flow li::after{display:none}.approach-flow button{min-height:110px}}</style></head><body><a class="skip" href="#main">Skip to content</a><header><div><span class="brand">BioTasks / Notebook → task</span><a href="https://github.com/Open-Athena/biotasks/issues/19">Research issue #19 ↗</a></div></header><main id="main"><div class="links" id="release-links"></div><nav aria-label="Explorer sections"><button id="show-approaches">Approaches</button><button id="show-notebooks">Notebooks</button></nav><div id="content"></div><footer>Research evidence · original artifacts preserved · interface adapted from the issue #17 explorer</footer></main><div hidden id="data">__DATA__</div><script>const D=JSON.parse(document.getElementById('data').textContent), $=id=>document.getElementById(id);
function el(tag,text,parent,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=typeof text==='string'?text:JSON.stringify(text,null,2);if(cls)e.className=cls;if(parent)parent.append(e);return e}
function markdown(text,parent){const box=el('div',undefined,parent,'markdown');if(Object.hasOwn(D.rendered_markdown,text))box.innerHTML=D.rendered_markdown[text];else el('pre',text,box);return box;}
function codeBlock(text,parent){const node=el('code',undefined,el('pre',undefined,parent,'syntax-code'));if(Object.hasOwn(D.rendered_code,text))node.innerHTML=D.rendered_code[text];else node.textContent=text;}
function link(url,label,parent){const a=el('a',label,parent);if(/^https:\/\//.test(url)){a.href=url;a.target='_blank';a.rel='noopener noreferrer';}return a;}
function detail(title,value,parent){const d=el('details',undefined,parent);el('summary',title,d);el('pre',value,d);return d;}
function card(title,text,note,parent,code=false){const c=el('section',undefined,parent,'task-card');el('h2',title,c);el('p',code?'Recorded source · verbatim':'Recorded artifact · reading view',c,'status');const a=el('div',undefined,c,'artifact-scroll'+(code?' code-surface':''));a.tabIndex=0;a.setAttribute('role','region');a.setAttribute('aria-label',title);if(code)codeBlock(text,a);else markdown(text,a);el('p',note,el('div',undefined,c,'annotations'));return c;}
function selector(label,items,parent,show){const l=el('label',label,parent);const s=el('select',undefined,l);items.forEach((x,i)=>{const o=el('option',x,s);o.value=i;});s.onchange=()=>show(Number(s.value));return s;}
let view='approaches',tab='Notebook',step=1;
const stages=[['Source','Notebook + real data','The pinned Scanpy notebook and full observed PBMC3k matrix define the analysis and its provenance.'],['Authoring','SETA design → Harbor task','GLM-5.3 uses upstream structured calls to propose a compact task and build instructions, environment, reference and grader.'],['Validation & repair','Controls → review → GLM repair','Native oracle/no-op and wrong/valid-alternative controls are combined with GLM scientific, schema and coercion audits. Only GLM repairs task artifacts.'],['Solve & release','Blind attempt → verified publication','GLM-5.3 via Terminus-2 solves offline for at most five minutes. The quality loop, fidelity review, release verification and fresh download establish the recorded outcome.']];
function callsFor(i){return D.calls.filter(x=>{const p=x.path;return i===0?false:i===1?p.includes('/campaign/'):i===2?!p.includes('/campaign/')&&!p.includes('/fidelity/'):p.includes('/fidelity/');});}
function renderApproach(){const root=$('content');el('h1','How this notebook becomes a task',root);el('p','Repo2RLEnv · SETA Seed2Synth · GLM-5.3 throughout. Select a stage to inspect its inputs, exact recorded prompts and outputs.',root,'muted');const browse=el('button','Browse notebook →',root);browse.onclick=()=>{view='notebooks';render();};const c=el('article',undefined,root,'approach-card');el('h2','Notebook-grounded SETA pipeline',c);el('p','One-notebook pilot · factory-only improvements · bounded quality loop',c,'status');const flow=el('ol',undefined,c,'approach-flow');const body=el('section',undefined,c,'approach-step-panel');const buttons=[];stages.forEach((s,i)=>{const b=el('button',undefined,el('li',undefined,flow));el('span',String(i+1).padStart(2,'0')+' · '+s[0],b);el('strong',s[1],b);buttons.push(b);b.onclick=()=>{step=i;show();};});function show(){buttons.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===step)));body.replaceChildren();el('h3',stages[step][1],body);el('p',stages[step][2],body);if(step===0){el('p',D.notebook.title,body);link(D.notebook.url,'Pinned original notebook ↗',body);detail('Source revision and checksum',D.notebook,body);detail('Source licenses',D.licenses,body);return;}const calls=callsFor(step);const slot=el('div',undefined,body);const record=el('div',undefined,body);if(calls.length){selector('Recorded model call',calls.map(x=>'Campaign '+x.campaign+' · '+x.path),slot,i=>showCall(calls[i],record));showCall(calls[0],record);}else el('p','No model call is selected for this stage.',record);if(step===3){detail('Release and validation record',D.status,body);const b=el('button','Inspect attempts →',body);b.onclick=()=>{view='notebooks';tab='Attempt';render();};}const t=detail('Current version-controlled guidance (separate from recorded inputs)',undefined,body);t.lastChild.remove();Object.entries(D.templates).forEach(([k,v])=>card(k,v,'Template source; exact rendered historical inputs are shown above.',t,true));}show();}
function showCall(x,root){root.replaceChildren();el('p','Original request SHA-256: '+x.sha256,root,'status');card('System prompt',x.content.system??JSON.stringify(x.content,null,2),'Exact recorded authoring/review input.',root,true);card('Rendered user input',x.content.user??JSON.stringify(x.content.messages??{},null,2),'Task-specific input recorded by the pipeline; no manual task repair.',root,true);detail('Expected response schema',x.content.response_schema,root);card('Recorded model response',JSON.stringify(x.response,null,2),'Model output is evidence of what was proposed; native tests determine rewards.',root,true);}
function renderNotebook(){const root=$('content');el('h1','Notebook → task → attempt',root);const tools=el('div',undefined,root,'toolbar');selector('Notebook',[D.notebook.title],tools,()=>{});selector('Task-generation approach',['Repo2RLEnv SETA · GLM-5.3'],tools,()=>{});const nav=el('nav',undefined,root);nav.setAttribute('aria-label','Notebook workspace');const panel=el('section',undefined,root,'panel');const btns=[];for(const name of ['Notebook','Task','Attempt','Review']){const b=el('button',name,nav);btns.push(b);b.onclick=()=>{tab=name;show();};}function show(){btns.forEach(b=>b.setAttribute('aria-selected',String(b.textContent===tab)));panel.replaceChildren();if(tab==='Notebook'){el('h2',D.notebook.title,panel);link(D.notebook.url,'Original pinned source ↗',panel);el('p','Captured notebook source, rendered by cell. Reading view only; no kernel is started. Original outputs are available from the source link.',panel,'viewer-help');const parts=D.notebook.text.split(/--- (markdown|code) cell (\d+) ---\n/g);for(let i=1;i<parts.length;i+=3){const cell=el('section',undefined,panel);el('small',parts[i]+' cell '+parts[i+1],cell);if(parts[i]==='code'){codeBlock(parts[i+2],cell);}else markdown(parts[i+2],cell);}detail('Source license notices',D.licenses,panel);}else if(tab==='Task'){el('h2','Published task · campaign '+D.campaign,panel);el('p',D.bundle,panel,'status');card('Prompt',D.documents['task/instruction.md'],'Actual solver-facing task instructions. Software choice remains open within the scientific contract.',panel);for(const [k,v]of Object.entries(D.documents)){if(!k.startsWith('task/')||k==='task/instruction.md')continue;card(k.replace('task/',''),v,k.includes('/tests/')?'Private verifier asset, withheld from the solver.':k.includes('/solution/')?'GLM-authored reference solution, separate from blind attempts.':'Recorded Harbor task asset.',panel,true);}detail('Creation and validation diagnostics',D.documents['execution/quality'],panel);}else if(tab==='Attempt'){renderAttempts(panel);}else{el('h2','Review and release',panel);el('p',D.status.summary,panel);D.status.findings.forEach(x=>el('p',x,panel));detail('Verification and publication evidence',D.status,panel);detail('Final quality report',D.documents['execution/quality'],panel);el('p','Limits: one notebook; no broad adversarial audit; model review is not an independent biological rerun; scientific dependencies/base image remain unpinned.',panel);}}show();}
function renderAttempts(root){el('h2','Native controls and blind solver attempts',root);el('p','Each result belongs to its recorded bundle. Reward 1 means the grader accepted the artifact; it does not exclude every possible defect.',root,'status');const box=el('div',undefined,root);const target=el('div',undefined,root);function show(i){target.replaceChildren();const x=D.attempts[i];const metrics=el('div',undefined,target,'metrics');el('span','Reward '+x.reward,metrics);el('span','Campaign '+x.campaign+' · '+x.role,metrics);el('p',x.bundle,target,'status');if(x.trajectory){el('h3','Solver trace · GLM-5.3 / Terminus-2',target);for(const s of x.trajectory.steps??[]){const d=el('details',undefined,target);el('summary',s.step_id+' · '+s.source,d);card('Recorded message',s.message??'','Timestamp: '+(s.timestamp??'unavailable'),d);for(const [k,v]of Object.entries(s))if(!['message','step_id','source','timestamp'].includes(k))detail(k,v,d);}}else el('p','Deterministic control; no blind solver conversation.',target);detail('Grading and execution evidence',{...x,trajectory:undefined},target);}const s=selector('Model / attempt',D.attempts.map(x=>'Campaign '+x.campaign+' · '+x.role+(x.probe?' / '+x.probe.kind:'')+' · reward '+x.reward),box,show);s.value=D.attempts.length-1;show(D.attempts.length-1);}
function render(){$('content').replaceChildren();$('show-approaches').setAttribute('aria-selected',String(view==='approaches'));$('show-notebooks').setAttribute('aria-selected',String(view==='notebooks'));if(view==='approaches')renderApproach();else renderNotebook();try{history.replaceState(null,'','#'+(view==='approaches'?'pipeline':tab.toLowerCase()));}catch{}}
$('show-approaches').onclick=()=>{view='approaches';render();};$('show-notebooks').onclick=()=>{view='notebooks';render();};link(D.status.release_url,'Immutable release ↗',$('release-links'));link('https://huggingface.co/spaces/HuggingFaceH4/harbor-visualiser?dataset=gonzalobenegas/biotasks-notebook-pilot-issue-19','Harbor Visualiser ↗',$('release-links'));
const hash=location.hash.slice(1).toLowerCase();if(['notebook','task','attempt','attempts','review'].includes(hash)){view='notebooks';tab=hash.startsWith('attempt')?'Attempt':hash[0].toUpperCase()+hash.slice(1);}render();
</script></body></html>
