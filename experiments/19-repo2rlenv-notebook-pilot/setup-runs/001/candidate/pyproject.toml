[project]
name = "scanpy-clustering-analysis"
version = "1.0.0"
description = "Offline-science environment for the scanpy 'Preprocessing and clustering' tutorial reference run."
requires-python = ">=3.13,<3.14"
dependencies = [
  "anndata>=0.12.14",
  "h5py>=3.11",
  "igraph>=0.10.8",
  "leidenalg>=0.10.1",
  "matplotlib>=3.10",
  "numpy>=2.2.5",
  "pandas>=2.3",
  "pooch>=1.8.0",
  "scanpy>=1.11.4",
  "scikit-image>=0.25",
  "scikit-learn>=1.6",
  "scipy>=1.15",
  "seaborn>=0.13.2",
  "statsmodels>=0.14.5",
  "umap-learn>=0.5.12",
]
