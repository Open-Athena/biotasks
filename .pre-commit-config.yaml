repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check --fix
        language: system
        types_or: [python, pyi]
        files: ^(src|tests)/
        require_serial: true
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
        files: ^(src|tests)/
        require_serial: true
      - id: ty
        name: ty type checking
        entry: uv run --locked ty check
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
